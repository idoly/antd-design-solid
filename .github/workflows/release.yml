name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run audit:antd
      - run: npm run audit:tokens
      - run: npm run typecheck
      - run: npm run test:strict
      - run: npm run build
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_INCLUDE_WEBKIT: '1'
          PLAYWRIGHT_SKIP_SCREENSHOTS: '1'
      - name: Verify tag matches package version
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Expected tag ' + expected + ', received ' + process.env.GITHUB_REF_NAME)"
      - run: npm run check:package
      # The release job has already run the full prepublish gates above.
      - run: npm publish --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
